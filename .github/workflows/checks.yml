name: checks

on:
  pull_request:
  push:
    branches:
      - refactor/clinical-safety-foundation

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify
        run: npm run verify
