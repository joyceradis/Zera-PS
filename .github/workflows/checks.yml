name: checks

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Guard critical safety sentinels
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "::error title=Critical safety sentinel invalid::$1"
            exit 1
          }

          required=(
            "docs/clinical/INVARIANT_REGISTRY.md"
            "tests/invariant-coverage.test.mjs"
            "tests/integration-static.test.mjs"
          )

          for path in "${required[@]}"; do
            [[ -s "$path" ]] || fail "$path is missing or empty"
          done

          # File existence alone is not enough: an emptied/weakened sentinel would
          # otherwise satisfy this outer guard. These checks intentionally verify
          # only the minimum wiring that must exist before the Node suite is trusted
          # to validate the richer semantics.
          grep -q 'INV-GOV-001' docs/clinical/INVARIANT_REGISTRY.md \
            || fail 'registry no longer declares INV-GOV-001'
          grep -q 'INV-CLIN-001' docs/clinical/INVARIANT_REGISTRY.md \
            || fail 'registry no longer declares INV-CLIN-001'
          grep -q 'INVARIANT_REGISTRY\.md' tests/invariant-coverage.test.mjs \
            || fail 'invariant gate is no longer wired to the registry'
          grep -q "'INV-GOV-001'" tests/invariant-coverage.test.mjs \
            || fail 'invariant gate no longer maps INV-GOV-001'
          grep -q 'the invariant coverage gate exists and is wired to the clinical registry' tests/integration-static.test.mjs \
            || fail 'external anchor for invariant gate is missing'

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Verify
        run: npm run verify
